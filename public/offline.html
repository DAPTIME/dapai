<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — DAP AI</title>
    <meta name="theme-color" content="#090d15" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #090d15;
        color: #e8ecf5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.5rem; margin: 20px 0 8px; font-weight: 600; }
      p { margin: 0; color: #93a0b8; max-width: 30ch; line-height: 1.5; }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #6d5cff, #2ea8ff);
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="DAP AI" />
      <h1>You're offline</h1>
      <p>DAP AI needs a connection to answer. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
