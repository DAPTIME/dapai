<title>Welcome to DAP AI</title>

<!--
  ════════════════════════════════════════════════════════════════════
  DAP AI · FIRST-SIGNUP INTRO  ·  ~5 seconds, plays once
  ════════════════════════════════════════════════════════════════════

  Shown immediately after a user creates their account. It has one job:
  in five seconds, make it obvious that DAP AI runs on real hardware.

  ── Beats ───────────────────────────────────────────────────────────
    0.0 - 1.0s   Silicon wakes. Camera starts inside the die: CPU, RAM
                 and PCB traces power on.
    1.0 - 2.5s   The DAP AI mark assembles out of the electricity, with
                 "Powered by DAP AI hardware".
    2.5 - 4.0s   Camera pulls out to the whole Jetson Orin Nano and
                 orbits it — fan spinning, LEDs blinking.
    4.0 - 5.0s   "Meet the hardware behind DAP AI." → "Explore how it
                 works →", then it hands off to the site.

  ── Engine ──────────────────────────────────────────────────────────
    Anime.js v4, inlined. This runs the instant someone signs up, so it
    cannot depend on a CDN being reachable — an earlier version of the
    About-page reveal shipped with a CDN fetch and rendered blank in
    production when that fetch failed. There are no CSS @keyframes:
    every moving thing is on the Anime.js timeline.

  ── Hardware IDs (as specified) ─────────────────────────────────────
    #cpu  #ram  #gpu  #fan  #dapLogo  #siliconParticles  #pcbTraces
    plus #rig (the camera), #fanBlades, #board.

  ── Embedding ───────────────────────────────────────────────────────
    Listen for the `dap-intro-done` message to know when to hand over:

      const f = document.querySelector("iframe");
      window.addEventListener("message", (e) => {
        if (e.data === "dap-intro-done") f.remove();
      });

    It also fires window.onDapIntroDone() if you'd rather use a callback,
    and honours prefers-reduced-motion by finishing immediately.
  ════════════════════════════════════════════════════════════════════
-->

<style>
  /* Static styling only — all motion is Anime.js, by design. */
  :root {
    --nv:     #76b900;
    --nv-lit: #a5e832;
    --ink:    #04060a;
    --text:   #eaf2e6;
    --muted:  #8fa189;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--text);
    font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Fixed canvas ─────────────────────────────────────────────────
     Laid out at one of three fixed sizes and scaled to fit, so the
     composition is the same everywhere and the browser rasterises a
     known number of pixels. Centred by translate rather than by a grid,
     because the canvas is larger than the viewport before it is scaled
     and centring an overflowing grid child pushes it into a corner. */
  #fit { position: absolute; inset: 0; overflow: hidden; }
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--sw, 1920px);
    height: var(--sh, 1080px);
    transform-origin: center center;
    overflow: hidden;
    background: radial-gradient(900px 620px at 50% 46%, #0b1410 0%, #05080b 58%, #000 100%);
  }

  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* The camera. A fixed origin keeps the push-out steady while the
     board's bounding box changes underneath it. */
  #rig { transform-box: view-box; transform-origin: 600px 350px; }

  /* ── Captions ─────────────────────────────────────────────────── */
  /* Low enough to clear the wordmark under the logo mark, high enough
     to stay off the Skip button. */
  .caption {
    position: absolute;
    left: 0; right: 0;
    bottom: 9%;
    display: grid;
    justify-items: center;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  /* Both closing lines share one grid cell so the second replaces the
     first in place. Stacked in flow, the outgoing line kept reserving
     its row and pushed the incoming one down the frame. */
  .kicker { grid-area: 1 / 1; }
  .line   { grid-area: 2 / 1; }
  .line {
    margin: 0;
    opacity: 0;
    font-weight: 250;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: #fff;
    font-size: calc(clamp(19px, calc(var(--sw) * 0.03200), 42px) * var(--ui, 1));
  }
  .line em { font-style: normal; font-weight: 500; color: var(--nv-lit); }
  .kicker {
    margin: 0;
    opacity: 0;
    font-size: calc(clamp(10px, calc(var(--sw) * 0.01150), 13px) * var(--ui, 1));
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Skip is always available — nobody should be trapped in an intro. */
  #skip {
    position: absolute;
    right: calc(var(--sw) * 0.03500); bottom: calc(var(--sh) * 0.04500);
    z-index: 20;
    opacity: 0;
    padding: 8px 18px;
    font: inherit;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(10, 18, 12, 0.6);
    border: 1px solid rgba(118, 185, 0, 0.22);
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  #skip:hover { color: var(--text); border-color: rgba(118, 185, 0, 0.5); }

  /* Wipes to the site at the end. */
  #wipe {
    position: absolute;
    inset: 0;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    background: var(--ink);
  }
</style>
</head>

        <!-- PCB traces. Real <path> elements because the silicon
             particles ride them; routed between the parts they connect. -->
        <g id="pcbTraces" stroke="#76b900" fill="none" stroke-width="1.6" opacity="0.30"
           stroke-linecap="round">
          <path id="tr1" d="M596 348 C 640 372, 690 396, 736 420"/>
          <path id="tr2" d="M540 340 C 500 344, 464 352, 428 360"/>
          <path id="tr3" d="M628 288 C 668 284, 700 281, 730 278"/>
          <path id="tr4" d="M470 452 C 540 462, 620 456, 700 448"/>
          <path id="tr5" d="M436 430 C 456 400, 486 366, 522 342"/>
          <path id="tr6" d="M760 300 C 792 330, 800 380, 776 420"/>
        </g>

        <!-- Cooling. The same fan cut-out, laid over the render's own
             fan and turning, dropped to the render's value — the source
             shot is lit much brighter. -->
        <g id="fan">
          <g transform="translate(582 244) scale(1 0.59)">
            <g id="fanBlades" style="transform-box: fill-box; transform-origin: 50% 50%;">
              <g transform="scale(0.079)"><use href="#fanShot"/></g>
            </g>
          </g>
        </g>

        <!-- Silicon. All of it is inside the module on the real board,
             so these are light escaping the heatsink rather than chips
             sitting next to each other. The ids are the contract. -->
        <g id="gpu">
          <ellipse id="gpuLit" cx="470" cy="268" rx="70" ry="46" fill="#76b900"
                   fill-opacity="0.34" opacity="0" filter="url(#softGlow)"/>
        </g>
        <g id="cpu">
          <ellipse id="cpuLit" cx="612" cy="316" rx="58" ry="30" fill="#5aa9e6"
                   fill-opacity="0.30" opacity="0" filter="url(#softGlow)"/>
        </g>
        <g id="ram">
          <ellipse id="ramLit" cx="586" cy="354" rx="72" ry="18" fill="#d9b45a"
                   fill-opacity="0.32" opacity="0" filter="url(#softGlow)"/>
        </g>

        <circle id="ledPwr" cx="826" cy="222" r="5" fill="#76b900" opacity="0"/>
        <circle id="ledAct" cx="808" cy="222" r="5" fill="#d9b45a" opacity="0"/>

        <!-- Electricity riding the traces. Injected at runtime. -->
        <g id="siliconParticles"></g>
      </g>

    </g>

    <!-- ── The DAP AI mark, assembled from the electricity ──────────
         Deliberately outside #rig. Inside it, the 5.4x opening camera
         magnified the mark to twice the frame and pushed its wordmark
         off the bottom edge. Out here it is drawn at its final size and
         sits dead centre whatever the camera is doing — which is where
         the camera is looking anyway, so it still forms in the silicon. -->
    <!-- One plain wrapper for the lock-up move. Animating translateY on
         #dapLogo itself fights its transform-box: fill-box, so the move
         did not land; this group has no transform-box of its own. -->
    <g id="logoPos">
    <g transform="translate(600 350)">
      <g id="dapLogo" opacity="0" style="transform-box: fill-box; transform-origin: 50% 50%;">
        <!-- Dashed so the rotation actually reads. -->
        <circle id="logoRing" cx="0" cy="0" r="95" fill="none" stroke="#a5e832"
                stroke-width="6.2" stroke-dasharray="36 25" filter="url(#glow)"/>
        <path id="logoMark" d="M-36 -48 V48 M-36 -48 H0 Q34 -48 34 0 Q34 48 0 48 H-36"
              fill="none" stroke="#ffffff" stroke-width="12.3" stroke-linecap="round"
              stroke-linejoin="round" filter="url(#glow)"/>
        <text id="logoWord" x="0" y="132" text-anchor="middle" font-size="40" font-weight="600"
              letter-spacing="12" fill="#ffffff" opacity="0">DAP AI</text>
      </g>
      <!-- Particles that fly in to build the mark. -->
      <g id="logoDust"></g>
    </g>
    </g>
  </svg>

  <div class="caption">
    <p class="kicker" id="kicker">Powered by DAP AI hardware</p>
    <p class="line" id="line1">Meet the hardware behind <em>DAP AI</em>.</p>
    <p class="line" id="line2">Explore how it works <em>&rarr;</em></p>
  </div>

<script type="module">
/* ══════════════════════════════════════════════════════════════════
   DAP AI signup intro — Anime.js drives every moving thing.
   ══════════════════════════════════════════════════════════════════ */

const anime = window.__anime__;
const { animate, createTimeline, stagger, svg, utils } = anime;

const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── Canvas size ───────────────────────────────────────────────────
   Same three tiers as the hardware reveal. Physical screen size is not
   exposed to the web — there is no inches API and devicePixelRatio is a
   ratio, not a measurement — so a coarse pointer stands in for "phone
   or tablet, whatever its pixel count", and an unscaled wide desktop
   stands in for "large panel". The bias is downward by design. */
const stageEl = document.getElementById("stage");

function pickCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const physical = window.screen.width * dpr;
  const css = window.innerWidth;
  if (window.matchMedia("(pointer: coarse)").matches || css < 760)
    return { w: 1080, h: 1920, ui: 1.5, name: "1080p portrait" };
  if (physical >= 3800 && css >= 2200) return { w: 3840, h: 2160, ui: 1, name: "2160p" };
  if (physical >= 2500) return { w: 2560, h: 1440, ui: 1, name: "1440p" };
  return { w: 1920, h: 1080, ui: 1, name: "1080p" };
}

let canvas = null;
function applyCanvas() {
  const next = pickCanvas();
  if (!canvas || canvas.w !== next.w || canvas.ui !== next.ui) {
    canvas = next;
    stageEl.style.setProperty("--sw", `${next.w}px`);
    stageEl.style.setProperty("--sh", `${next.h}px`);
    stageEl.style.setProperty("--ui", String(next.ui));
    stageEl.dataset.canvas = next.name;
  }
  const k = Math.min(window.innerWidth / canvas.w, window.innerHeight / canvas.h);
  stageEl.style.transform = `translate(-50%, -50%) scale(${k.toFixed(5)})`;
}
applyCanvas();
window.addEventListener("resize", applyCanvas);
window.addEventListener("orientationchange", applyCanvas);
const SVGNS = "http://www.w3.org/2000/svg";

/** Inject an SVG fragment. */
function stamp(parent, markup) {
  const holder = document.createElementNS(SVGNS, "g");
  holder.innerHTML = markup;
  while (holder.firstChild) parent.appendChild(holder.firstChild);
}

/* ── Silicon electricity ────────────────────────────────────────────
   Two particles per trace: enough to read as constant activity, few
   enough to stay well inside frame budget on a modest laptop. */
const TRACES = ["#tr1", "#tr2", "#tr3", "#tr4", "#tr5", "#tr6"];
{
  let markup = "";
  for (let t = 0; t < TRACES.length; t++) {
    for (let k = 0; k < 2; k++) {
      markup += `<circle class="spark s${t}" cx="0" cy="0" r="3"
                         fill="#a5e832" opacity="0" filter="url(#glow)"/>`;
    }
  }
  stamp(document.getElementById("siliconParticles"), markup);
}

/* ── Dust that assembles the logo ───────────────────────────────── */
const DUST = 26;
{
  let markup = "";
  for (let i = 0; i < DUST; i++) {
    markup += `<circle class="dust" cx="0" cy="0" r="3.2" fill="#a5e832" opacity="0"/>`;
  }
  stamp(document.getElementById("logoDust"), markup);
}
// Scatter them well outside the ring; the timeline pulls them into it.
const dustEls = [...document.querySelectorAll(".dust")];
const dustFrom = dustEls.map((_, i) => {
  const a = (i / DUST) * Math.PI * 2 + 0.6;
  const r = 135 + (i % 5) * 40;
  return { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.62 };
});
dustEls.forEach((el, i) => utils.set(el, { translateX: dustFrom[i].x, translateY: dustFrom[i].y }));

/* ── Camera ────────────────────────────────────────────────────────
   Anime.js composes the matrix as scale · translate, so the offset is
   applied in the *scaled* space — the browser reports translate(-40)
   at scale 5.4 as a -216 shift. A point p therefore lands at
   origin + scale * (p - origin + t), and holding FOCUS in the middle
   of frame needs t = -(FOCUS - origin), with no scale factor.

   Multiplying by the scale here is what blanked the opening: it moved
   the camera 5.4x too far and left the board off the top-left corner.
   Verified against the computed matrix rather than by eye. */
const ORIGIN = { x: 600, y: 350 };   // matches #rig's transform-origin
const FOCUS  = { x: 640, y: 405 };   // fan blades, trace fan-out, CPU edge
const OPEN_SCALE = 5.4;
const openX = -(FOCUS.x - ORIGIN.x);
const openY = -(FOCUS.y - ORIGIN.y);

/* Where the camera comes to rest. The scene is sliced to fill the frame,
   so a portrait phone only ever sees a narrow column of the viewBox and
   the board ran off both edges. Pull back far enough that it fits, and
   never past 1 — on a desktop the board should still fill the frame.
   The board is centred on ORIGIN, so scaling alone reframes it. */
const BOARD_W = 570;                          // board footprint, viewBox units
const vb = document.getElementById("scene").getBoundingClientRect();
const cover = Math.max(vb.width / 1200, vb.height / 700) || 1;
const REST_SCALE = Math.min(1, (vb.width / cover) * 0.94 / BOARD_W);

/* The camera no longer opens inside the die — the mark has the frame to
   itself, so there is nothing to push out of. It sits at rest
   throughout and the board simply arrives behind the logo. */
utils.set("#rig", { scale: REST_SCALE, translateX: 0, translateY: 0 });
utils.set("#board", { opacity: 0 });
utils.set("#dapLogo", { scale: 0.28 });

/* ══════════════════════════════════════════════════════════════════
   MASTER TIMELINE — five seconds, start to hand-off
   ══════════════════════════════════════════════════════════════════ */
const tl = createTimeline({ defaults: { ease: "outExpo" }, autoplay: false });

/* ══════════════════════════════════════════════════════════════════
   The mark first, the machine behind it
   ══════════════════════════════════════════════════════════════════
   This used to open deep inside the silicon and treat the logo as one
   beat along the way. It is a signup intro, so the mark leads: it
   builds alone in the dark, holds, and only then does the hardware it
   runs on resolve behind it.

     0.0   the mark assembles out of the dust
     1.9   it holds, and charges
     2.6   the machine behind it fades up, mark rises out of its way
     4.1   the closing line, then the wipe
   ══════════════════════════════════════════════════════════════════ */

/* ── 0.0 → 1.9s · the mark ─────────────────────────────────────── */
tl.add("#wakeGlow", { opacity: [0, 0.55], duration: 900 }, 100);
tl.add("#skip",     { opacity: [0, 1], duration: 500 }, 600);

// Larger than it ends up: this is the only thing on screen, so it holds
// the frame rather than sitting in the middle of it.
tl.add("#dapLogo", { opacity: [0, 1], scale: [0.28, 1.34], duration: 900,
                     ease: "outExpo" }, 120);
tl.add(".dust", {
  opacity: [{ to: 0.95, duration: 240 }, { to: 0, duration: 460, delay: 420 }],
  translateX: 0, translateY: 0,
  duration: 1000, delay: stagger(14), ease: "inOutQuad",
}, 120);
tl.add(svg.createDrawable("#logoMark"),
       { draw: ["0 0", "0 1"], duration: 820, ease: "inOutQuad" }, 320);
tl.add("#logoRing", { rotate: [0, 300], opacity: [0, 0.9], duration: 1500,
                      ease: "outQuart" }, 240);
tl.add("#logoWord", { opacity: [0, 1], translateY: [12, 0], duration: 600 }, 900);
tl.add("#kicker",   { opacity: [0, 1], translateY: [10, 0], duration: 520 }, 1120);

/* ── 1.9 → 2.6s · it charges ────────────────────────────────────
   A brief brightening through the mark and the ring, which is what
   gives the hold something to be rather than a pause. */
tl.add("#logoMark", { stroke: ["#ffffff", "#d8ffb0"], duration: 260 }, 1520);
tl.add("#logoMark", { stroke: "#ffffff", duration: 420 }, 1780);
tl.add("#logoRing", { rotate: 360, opacity: 0.7, duration: 900, ease: "outQuad" }, 1560);

/* ── 2.6 → 4.1s · the machine behind it ─────────────────────────── */
tl.add("#board", { opacity: [0, 1], duration: 900, ease: "outQuad" }, 2600);
tl.add("#wakeGlow", { opacity: 0.85, duration: 800 }, 2600);
tl.add(svg.createDrawable(TRACES), {
  draw: ["0 0", "0 1"], duration: 900, delay: stagger(60), ease: "inOutQuad",
}, 2760);
tl.add("#ramLit", { opacity: [0, 0.36], duration: 620 }, 3000);
tl.add("#cpuLit", { opacity: [0, 0.30], duration: 620 }, 3140);
tl.add("#gpuLit", { opacity: [0, 0.36], duration: 620 }, 3280);
tl.add(".spark",  { opacity: [0, 1], duration: 420, delay: stagger(22) }, 3200);
tl.add(["#ledPwr", "#ledAct"], { opacity: [0, 1], duration: 340, delay: stagger(110) }, 3420);

// The mark stays — it just gets out of the board's way and settles into
// a lock-up above it rather than vanishing the moment the hardware lands.
// Clear of the heatsink, whose top edge is around 184 in viewBox units:
// at 0.44 the ring spans 26 to 110 and the wordmark sits at 126.
tl.add("#dapLogo", { scale: 0.44, duration: 1100, ease: "inOutQuart" }, 2600);
tl.add("#logoPos", { translateY: -238, duration: 1100, ease: "inOutQuart" }, 2600);
tl.add("#kicker", { opacity: 0, duration: 380, ease: "inQuad" }, 2600);

// A slow lean, which reads as an orbit without leaving 2D.
tl.add("#rig", { rotate: [-2.2, 1.8], duration: 1800, ease: "inOutSine" }, 2700);

/* ── 4.1 → 5.1s · hand off ──────────────────────────────────────── */
tl.add("#line1", { opacity: [0, 1], translateY: [16, 0], duration: 440 }, 4060);
tl.add("#line1", { opacity: 0, translateY: -14, duration: 240, ease: "inQuad" }, 4520);
tl.add("#line2", { opacity: [0, 1], translateY: [16, 0], duration: 340 }, 4820);
tl.add("#wipe",  { opacity: [0, 1], duration: 300, ease: "inQuad" }, 5060);

tl.onComplete = () => finish();

/* ══════════════════════════════════════════════════════════════════
   ALWAYS-ON EFFECTS
   The board has to look powered the whole time, so these run
   independently of the timeline and never stop.
   ══════════════════════════════════════════════════════════════════ */

// Fan: continuous, linear, never stops.
animate("#fanBlades", { rotate: 360, duration: 900, ease: "linear", loop: true });

// Electricity along the PCB traces.
TRACES.forEach((sel, i) => {
  const path = svg.createMotionPath(sel);
  animate(`.s${i}`, {
    translateX: path.translateX,
    translateY: path.translateY,
    duration: 1500 + i * 180,
    delay: stagger(750),
    loop: true,
    ease: "linear",
  });
});

// Dies breathing under load.
animate("#gpuLit", { opacity: [0.22, 0.5],  duration: 780,  loop: true, alternate: true, ease: "inOutSine" });
animate("#cpuLit", { opacity: [0.16, 0.38], duration: 1020, loop: true, alternate: true, ease: "inOutSine" });
animate("#ramLit", { opacity: [0.2, 0.46],  duration: 900,  loop: true, alternate: true, ease: "inOutSine" });
animate("#ledAct", { opacity: [0.25, 1],    duration: 320,  loop: true, alternate: true, ease: "steps(2)" });

/* ══════════════════════════════════════════════════════════════════
   HAND-OFF
   ══════════════════════════════════════════════════════════════════ */
let done = false;
function finish() {
  if (done) return;
  done = true;
  try { window.parent?.postMessage("dap-intro-done", "*"); } catch { /* cross-origin */ }
  if (typeof window.onDapIntroDone === "function") window.onDapIntroDone();
}

document.getElementById("skip").addEventListener("click", () => {
  tl.pause();
  animate("#wipe", { opacity: 1, duration: 260, ease: "inQuad", onComplete: finish });
});

// Anyone who asked for less motion gets the destination, not the ride.
if (REDUCED) {
  utils.set("#wipe", { opacity: 1 });
  finish();
} else {
  /* Authored to a five second budget; the brief is now up to eight, and
     the extra time goes into letting the hardware read rather than into
     more beats. Playing the whole timeline slower stretches every beat
     and every hold in proportion, which is what a longer cut of the
     same edit should be — 5.15s becomes about 7.6s. */
  tl.speed = 0.73;   // hand-off lands ~7.5s, inside the eight second cap
  tl.play();
}
</script>
</body>
</html>
